<!DOCTYPE html>  <!--<html>:HTML 文件的開始標籤  #!DOCTYPE:告訴瀏覽器這是一份使用現代 HTML5 標準編寫的網頁-->
<html lang="zh-Hant">  <!--lang="zh-Hant"：表示網頁主要使用繁體中文-->
<head>  <!--是網頁的「設定區」-->
    <meta charset="UTF-8">  <!--<meta>：提供網頁相關設定資訊/charset：字元編碼設定/UTF-8：支援繁體中文、英文及大多數語言--> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!--name="viewport"：設定使用者看到的畫面範圍/width=device-width：網頁寬度配合裝置螢幕寬度/initial-scale=1.0：第一次開啟時使用正常縮放比例-->
    <title>製程異常分析輔助平台</title>   <!--裡面的文字會顯示在：瀏覽器上方的分頁/瀏覽器書籤/搜尋結果的標題-->
    <link rel="stylesheet" href="style.css">  <!--link:連接外部檔案/rel="stylesheet"：告訴瀏覽器連接的是樣式表/href="style.css"：指定要載入的檔案名稱(因兩份檔案在同資料夾寫檔名即可)-->
</head>
<body>  <!--是網頁的「可見內容區」-->
    <h1>製程異常分析輔助平台</h1>  <!--"h"代表heading標題/"h1"是網頁最重要的第一層標題-->
    <p>上傳製程量測資料，取得異常分類結果與可疑因子排名。</p>  <!--p 代表 paragraph（段落），適合放一般說明文字-->
    <button id="startButton">開始分析</button>

    <script src="app.js"></script>  <!--<script>：載入或撰寫 JavaScript/src="app.js"：指定載入同一資料夾中的 app.js/放在 </body> 前面，是為了讓瀏覽器先讀完 HTML 內容，再執行 JavaScript-->

</body>
</html>  <!--HTML 文件的結束標籤，/代表結束-->
